<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roguelike Grid Battle Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>Roguelike Grid Battle Simulator</h1>
            <div class="game-stats">
                <div class="stat">
                    <span class="stat-label">Wave:</span>
                    <span id="wave-number">1</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Energy:</span>
                    <span id="energy">3</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Units:</span>
                    <span id="unit-count">0</span>
                </div>
            </div>
        </header>

        <div class="game-main">
            <div class="battlefield-section">
                <canvas id="battlefield" width="640" height="640"></canvas>
                <div class="battlefield-controls">
                    <button id="end-turn-btn" class="btn btn-primary">End Turn</button>
                    <button id="view-paths-btn" class="btn btn-secondary">View Paths</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="hand-section">
                    <h3>Hand</h3>
                    <div id="hand" class="hand-container"></div>
                </div>

                <div class="deck-section">
                    <h3>Deck</h3>
                    <div id="deck-info" class="deck-info">
                        <span id="deck-count">0</span> cards remaining
                    </div>
                </div>

                <div class="enemy-hand-section">
                    <h3>Enemy Hand</h3>
                    <div id="enemy-hand" class="hand-container"></div>
                </div>

                <div class="log-section">
                    <h3>Battle Log</h3>
                    <div id="battle-log" class="battle-log"></div>
                </div>
            </div>
        </div>

        <div class="game-footer">
            <div class="wave-info">
                <span>Enemies Remaining: </span>
                <span id="enemies-remaining">0</span>
            </div>
            <div class="turn-info">
                <span>Turn: </span>
                <span id="turn-number">1</span>
            </div>
        </div>
    </div>

    <!-- Modal for card selection after wave -->
    <div id="card-selection-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Choose a Card</h2>
            <p>Select one card to add to your deck:</p>
            <div id="card-options" class="card-options"></div>
        </div>
    </div>

    <!-- Modal for game over -->
    <div id="game-over-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="game-over-title">Game Over</h2>
            <p id="game-over-message"></p>
            <button id="restart-btn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="js/game.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/units.js"></script>
    <script src="js/battlefield.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
